<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FivePlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    #frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none; /* hidden until src is set */
    }

    #fs-btn {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 9999;
      padding: 7px 13px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px;
      font: 13px/1 system-ui, sans-serif;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: opacity .15s;
    }
    #fs-btn:hover { opacity: .75; }

    #watermark {
      position: fixed;
      bottom: 6px;
      left: 0;
      right: 0;
      z-index: 9998;
      text-align: center;
      font: 16px/1 system-ui, sans-serif;
      color: rgba(255,255,255,0.18);
      pointer-events: none;
      user-select: none;
      letter-spacing: 2px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <iframe
    id="frame"
    allow="cross-origin-isolated; fullscreen; autoplay; clipboard-read; clipboard-write; gamepad"
    credentialless
    allowfullscreen
  ></iframe>

  <button id="fs-btn">⛶ Fullscreen</button>

  <div id="watermark">nexus superiority &nbsp; nexus superiority &nbsp; nexus superiority &nbsp; nexus superiority &nbsp; nexus superiority &nbsp; nexus superiority &nbsp; nexus superiority &nbsp; nexus superiority &nbsp; nexus superiority &nbsp; nexus superiority &nbsp; nexus superiority &nbsp; nexus superiority &nbsp; nexus superiority &nbsp; nexus superiority &nbsp; nexus superiority</div>

  <script>
    // ── URL resolution (XOR-decode then base64-decode) ───────────────────────
    // The real destination is never stored as plaintext in this file.
    // Split across two vars so string search tools don't reconstruct it trivially.
    var _a = "Ql5eWlkQBQVcGARMQ1xP";
    var _b = "WkZLUwRGRUYFTUtHTwRC";
    var _c = "XkdGFUdFTk8XWUtETkhF";
    var _d = "UgxJTE0XGw==";
    var _k = 42; // XOR key

    function _decode(s) {
      var raw = atob(s);
      var out = "";
      for (var i = 0; i < raw.length; i++) {
        out += String.fromCharCode(raw.charCodeAt(i) ^ _k);
      }
      return out;
    }

    // Reassemble and decode at runtime
    var _dst = _decode(_a + _b + _c + _d);

    // ── Service Worker for COOP/COEP headers ─────────────────────────────────
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js", { scope: "./" })
        .then(function(reg) {
          if (!navigator.serviceWorker.controller) {
            // First install — wait for activation then reload so headers apply
            reg.addEventListener("updatefound", function() {
              var sw = reg.installing;
              sw.addEventListener("statechange", function() {
                if (sw.state === "activated") location.reload();
              });
            });
          }
        });
    }

    // ── Mount the iframe src now ──────────────────────────────────────────────
    var frame = document.getElementById("frame");
    frame.src = _dst;
    frame.style.display = "block";

    // ── Fullscreen ────────────────────────────────────────────────────────────
    var btn = document.getElementById("fs-btn");

    function enterFS() {
      var el = document.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen)
        .call(el).catch(function(){});
    }
    function exitFS() {
      (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen)
        .call(document).catch(function(){});
    }

    btn.addEventListener("click", function() {
      (document.fullscreenElement || document.webkitFullscreenElement) ? exitFS() : enterFS();
    });

    ["fullscreenchange", "webkitfullscreenchange"].forEach(function(e) {
      document.addEventListener(e, function() {
        var inFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
        btn.textContent = inFS ? "✕ Exit fullscreen" : "⛶ Fullscreen";
      });
    });
  </script>

</body>
</html>
